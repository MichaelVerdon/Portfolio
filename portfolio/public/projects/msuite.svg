<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="MSuite">
  <defs>
    <radialGradient id="leak" cx="0.82" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffb36b" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ff5a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0d0d12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#8f85ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#4b3bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="#0d0d12"/>
  <rect width="640" height="360" fill="url(#leak)"/>
  <!-- optical flare -->
  <line x1="40" y1="250" x2="600" y2="110" stroke="#8f85ff" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="200" cy="210" r="70" fill="url(#flare)"/>
  <circle cx="330" cy="178" r="14" fill="#8f85ff" opacity="0.5"/>
  <circle cx="420" cy="155" r="26" fill="none" stroke="#8f85ff" stroke-opacity="0.45" stroke-width="2"/>
  <!-- glitch bars -->
  <g opacity="0.9">
    <rect x="0" y="62" width="250" height="6" fill="#4b3bff"/>
    <rect x="300" y="290" width="340" height="4" fill="#ff5a3c" opacity="0.8"/>
    <rect x="460" y="300" width="120" height="10" fill="#ffffff" opacity="0.15"/>
  </g>
  <!-- wordmark -->
  <g font-family="Space Grotesk, Segoe UI, sans-serif" font-weight="700" font-size="84" letter-spacing="-3">
    <text x="58" y="208" fill="#ff5a3c" opacity="0.7">MSuite</text>
    <text x="52" y="204" fill="#4b3bff" opacity="0.8">MSuite</text>
    <text x="55" y="206" fill="#ffffff">MSuite</text>
  </g>
  <text x="58" y="246" font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#d9d8de" letter-spacing="2">CRT · FLARES · GLITCH · LIGHT LEAKS · BURNS</text>
  <rect width="640" height="360" fill="url(#scan)"/>
</svg>
