version: 2.1
frontend:
  phases:
    build:
      commands:
        - cd portfolio
        - nvm install 22 && nvm use 22
        - npm ci
        # Tests run before every deploy, so a regression never reaches the live site.
        - npm test
        - npm run build
  artifacts:
    baseDirectory: portfolio/build
    files:
      - '**/*'
  cache:
    paths:
      - portfolio/node_modules/**/*
